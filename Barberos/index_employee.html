<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empleado</title>
    
    <!-- Tailwind CSS (desde CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos personalizados adicionales -->
    <style>
        /* Transiciones suaves para el menú desplegable */
        #dropdownMenu {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        /* Cuando NO esté oculto, permitir su expansión */
        #dropdownMenu:not(.hidden) {
            max-height: none; /* Lo manejaremos mediante JS */
        }
        
        /* Icono de menú con rotación suave */
        #menuIcon {
            transition: transform 0.3s ease-in-out;
        }

        /* Animación de hover para los botones */
        .option-card {
            transition: all 0.3s ease;
        }

        .option-card:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-blue-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-6 space-y-6">

        <div>
            <!-- Encabezado Principal -->
            <div class="text-center mb-4">
                <h1 class="text-4xl font-bold text-gray-800 mb-2">
                    Panel de Empleado
                </h1>
                <p class="text-gray-600 text-lg">Selecciona una opción del menú</p>
            </div>
            
            <!-- Vínculo para volver a Home (opcional) -->
            <div class="mb-4">
                <a href="login.html" class="text-sm text-gray-500 hover:text-blue-600 transition duration-150 ease-in-out">
                    ← Volver al inicio
                </a>
            </div>

            <hr class="my-4 border-gray-200" />

            <!-- Menú Desplegable -->
            <div class="w-full">
                <!-- Botón principal para abrir/cerrar menú -->
                <button
                    id="menuButton"
                    type="button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md flex items-center justify-center space-x-2 transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <span>Menú Principal</span>
                    <!-- Icono de flecha (Chevron Down) -->
                    <svg id="menuIcon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <!-- Contenedor del menú desplegable -->
                <div
                    id="dropdownMenu"
                    class="hidden mt-2 bg-gray-50 border border-gray-200 rounded-lg shadow-lg overflow-hidden"
                >
                    <ul class="py-2">
                        <!-- Opción 1: Realizar pago (gastos_admin.html) -->
                        <li>
                            <a
                                href="gastos_admin.html"
                                class="block px-4 py-3 text-gray-700 hover:bg-blue-600 hover:text-white transition duration-200"
                            >
                                💰 Realizar pago
                            </a>
                        </li>

                        <!-- Opción 3: Cobrar corte (cobranza.html) -->
                        <li>
                            <a
                                href="cobranza.html"
                                class="block px-4 py-3 text-gray-700 hover:bg-blue-600 hover:text-white transition duration-200"
                            >
                                ✂️ Cobrar corte
                            </a>
                        </li>

                        <!-- Opción 4: Agregar clientes (agregar_clientes.html) -->
                        <li>
                            <a
                                href="agregar_clientes.html"
                                class="block px-4 py-3 text-gray-700 hover:bg-blue-600 hover:text-white transition duration-200"
                            >
                                👤 Agregar clientes
                            </a>
                        </li>

                        <!-- Opción 5: Ver turnos (turnos.html) -->
                        <li>
                            <a
                                href="turnos.html"
                                class="block px-4 py-3 text-gray-700 hover:bg-blue-600 hover:text-white transition duration-200"
                            >
                                📅 Ver turnos
                            </a>
                        </li>

                        <!-- Opción 6: Reportes Avanzados (reports-advanced.html) -->
                        <li>
                            <a
                                href="reports-advanced.html"
                                class="block px-4 py-3 text-gray-700 hover:bg-blue-600 hover:text-white transition duration-200"
                            >
                                📊 Reportes Avanzados
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <hr class="my-6 border-gray-200" />

            <!-- Sección de Acceso Rápido (opcional) -->
            <section class="space-y-3">
                <h2 class="text-xl font-semibold text-gray-700 text-center">Acceso Rápido</h2>
                
                <!-- Tarjetas de acceso rápido -->
                <div class="grid grid-cols-1 gap-3">
                    <!-- Card 1: Cobrar Corte -->
                    <a
                        href="cobranza.html"
                        class="option-card block bg-gradient-to-r from-green-500 to-green-600 text-white rounded-lg p-4 shadow-md hover:shadow-xl text-center"
                    >
                        <div class="text-3xl mb-2">✂️</div>
                        <div class="font-semibold">Cobrar Corte</div>
                    </a>

                    <!-- Card 2: Realizar Pago -->
                    <a
                        href="gastos_admin.html"
                        class="option-card block bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-lg p-4 shadow-md hover:shadow-xl text-center"
                    >
                        <div class="text-3xl mb-2">💰</div>
                        <div class="font-semibold">Realizar Pago</div>
                    </a>
                </div>
            </section>
            
            <!-- Vínculo para Cerrar Sesión -->
            <div class="pt-4 text-center">
                <a href="login.html" class="text-sm text-gray-500 hover:text-red-600 transition duration-150 ease-in-out font-medium">
                    Cerrar Sesión
                </a>
            </div>

            <!-- Espacio para otros elementos o información -->
            <footer class="text-center pt-4">
                <p class="text-sm text-gray-400">Panel de Acceso Rápido v2.0</p>
            </footer>

        </div>
    </div>

    <script>
        // Lógica de JavaScript para el menú desplegable dinámico
        
        const menuButton = document.getElementById('menuButton');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const menuIcon = document.getElementById('menuIcon');

        // Función para manejar el despliegue/plegado del menú
        function toggleMenu() {
            const isHidden = dropdownMenu.classList.contains('hidden');

            if (isHidden) {
                // Mostrar el menú
                dropdownMenu.classList.remove('hidden');
                
                // Establecer la altura máxima para la transición suave
                // Esto simula el efecto dinámico al desplegar
                dropdownMenu.style.maxHeight = dropdownMenu.scrollHeight + "px";
                dropdownMenu.style.opacity = '1';
                
                // Rotar el icono para indicar que está abierto
                menuIcon.style.transform = 'rotate(180deg)';

            } else {
                // Ocultar el menú (iniciando la animación de cierre)
                dropdownMenu.style.maxHeight = '0';
                dropdownMenu.style.opacity = '0';
                
                // Rotar el icono a su posición original
                menuIcon.style.transform = 'rotate(0deg)';

                // Una vez que la transición termine, añadir la clase 'hidden' para accesibilidad
                setTimeout(() => {
                    if (dropdownMenu.style.maxHeight === '0px') {
                        dropdownMenu.classList.add('hidden');
                    }
                }, 300); // 300ms debe coincidir con la duración de la transición en CSS
            }
        }

        // Asignar el listener al botón
        menuButton.addEventListener('click', toggleMenu);

        // Ocultar el menú si se hace clic fuera de él
        document.addEventListener('click', (event) => {
            if (!dropdownMenu.contains(event.target) && !menuButton.contains(event.target)) {
                // Si está visible, ciérralo
                if (!dropdownMenu.classList.contains('hidden')) {
                    toggleMenu();
                }
            }
        });

        // Opcional: Cerrar el menú después de seleccionar una opción (simulando navegación)
        document.querySelectorAll('#dropdownMenu a').forEach(item => {
            item.addEventListener('click', (event) => {
                // En una app real, aquí se ejecutaría la navegación (ej. window.location.href = event.target.href)
                
                // Simulación: cerrar menú
                if (!dropdownMenu.classList.contains('hidden')) {
                    toggleMenu();
                }
            });
        });

    </script>
    <script>
        // Generador de frases bíblicas aleatorias (en español)
        (function(){
            const verses = [
                "Todo lo puedo en Cristo que me fortalece. (Filipenses 4:13)",
                "El Señor es mi pastor; nada me faltará. (Salmo 23:1)",
                "Porque yo sé los planes que tengo para vosotros, dice el Señor; planes de bienestar y no de calamidad. (Jeremías 29:11)",
                "Confía en el Señor con todo tu corazón, y no te apoyes en tu propia prudencia. (Proverbios 3:5)",
                "Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces. (Jeremías 33:3)",
                "El amor es paciente, es bondadoso. (1 Corintios 13:4)",
                "Jehová está cerca de los quebrantados de corazón. (Salmo 34:18)",
                "No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios. (Isaías 41:10)",
                "Bendice, alma mía, al Señor, y no olvides ninguno de sus beneficios. (Salmo 103:2)",
                "Buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas. (Mateo 6:33)"
            ];

            function getRandomVerse(){
                return verses[Math.floor(Math.random() * verses.length)];
            }

            function showVerse(){
                const el = document.getElementById('bibleText');
                if(!el) return;
                el.textContent = getRandomVerse();
            }

            document.addEventListener('DOMContentLoaded', () => {
                // Mostrar una frase al cargar la página
                showVerse();

                const btn = document.getElementById('newVerseBtn');
                if(btn) btn.addEventListener('click', showVerse);
            });
        })();
    </script>
</body>
</html>
